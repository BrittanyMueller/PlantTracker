
stages:
  - lint
  - build
  - test
  - deploy
    
.base_job:
  image: registry.larrycloud.ca/qawse3dr/plant-tracker:latest 
  dependencies: []

Lint:
  extends: .base_job
  stage: lint
  variables:
    BUILD_PLANT_LISTENER: 0
  script:
    - mkdir build
    - cd build
    - cmake .. -DCMAKE_BUILD_TYPE=
    - make test-format
  allow_failure: true
  
#########################################
#                                       #
#       PLANT TRACKER SERVER            #
#                                       #
#########################################
Build Plant Tracker Server:
  extends: .base_job
  stage: build
  script:
    - cd server
    - chmod +x ./gradlew
    - ./gradlew jar
    - mkdir -p ../out
    - mv app/build/libs/plant-tracker.jar ../out
    - cp app/src/main/resources/config.json ../out
  artifacts:
    paths:
      - out/
    expire_in: 1 week

Test Plant Tracker Server:
  extends: .base_job
  stage: test
  script:
    - cd server
    - chmod +x gradlew
    - ./gradlew test

Build Plant Tracker Server Docker:
  extends: .base_job
  stage: deploy
  image: docker:latest 
  tags:
    - dind
  dependencies:
    - Build Plant Tracker Server
  variables:
    IMAGE_NAME: registry.larrycloud.ca/qawse3dr/plant-tracker-server
    VERSION_FILE: deployment/docker/DOCKER_VERSION
    DOCKER_HOST: "unix:///var/run/docker.sock"  
  script:
    - echo "$DOCKER_PASSWORD" | docker login registry.larrycloud.ca -u "$DOCKER_USERNAME" --password-stdin
    - export IMAGE_VERSION=$(cat ${VERSION_FILE})
    # Build the Docker image
    - cp out/plant-tracker.jar deployment/docker
    - cd deployment/docker
    - docker build -t $IMAGE_NAME:$IMAGE_VERSION .
    # Tag the image with 'latest' as well
    - docker tag $IMAGE_NAME:$IMAGE_VERSION $IMAGE_NAME:latest

    # Push the image to Docker registry
    - docker push $IMAGE_NAME:$IMAGE_VERSION
    - docker push $IMAGE_NAME:latest
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master" && $CI_PIPELINE_SOURCE == "push"'
      changes: 
      - ${VERSION_FILE}


#########################################
#                                       #
#           PLANT LISTENER              #
#                                       #
#########################################
Build Plant Listener Tests:
  extends: .base_job
  stage: build
  artifacts:
    paths:
      - build
    expire_in: 1 week
  script:
    - mkdir build
    - cd build
    - cmake .. -DCMAKE_BUILD_TYPE=test
    - make -j4

Build Plant Listener:
  image: registry.larrycloud.ca/qawse3dr/plant-tracker-rpi-zero:latest  
  extends: .base_job
  stage: build
  script:
    - mkdir build
    - cd build
    - cmake -DCMAKE_BUILD_TYPE=release -DCMAKE_TOOLCHAIN_FILE=/home/develop/opt/x-tools/armv6-rpi-linux-gnueabihf/armv6-rpi-linux-gnueabihf.toolchain.cmake ..
    - make -j4
    - cpack -G DEB
    - mkdir -p ../out/listener
    - mv ./bin ../out/listener
    - mv ./lib ../out/listener
    - mv ../listener/data/config.json ../out/listener
    - mv _packages/* ../out
  artifacts:
    paths:
      - out/
    expire_in: 1 week


Test Coverage Plant Listener:
  extends: .base_job
  stage: test
  dependencies:
    - Build Plant Listener Tests
  artifacts:
    paths:
      - out/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: out/coverage.xml
  script:
    - cd build
    - ctest --output-on-failure
    - make plantlistener_coverage
    - cd ..
    - mkdir out
    - mv build/coverage out/coverage
    - mv build/coverage.xml out/coverage.xml

#########################################
#                                       #
#        PLANT TRACKER ANDROID          #
#                                       #
#########################################
Build Android Plant Tracker Debug:
  extends: .base_job
  image: registry.larrycloud.ca/qawse3dr/plant-tracker-android:latest
  stage: build
  variables:
    BUILD_PLANT_LISTENER: 0
  script:
    - mkdir -p build
    - echo "${GOOGLE_SERVICES_JSON}" > ./android/plant_tracker/app/google-services.json
    - cd build
    - cmake ..
    - make PlantTracker
  artifacts:
    paths:
      - build/PlantTracker.apk
    expire_in: 1 week

